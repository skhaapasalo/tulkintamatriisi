<title>Työvuorolista</title>
<!--
  TYÖVUOROLISTAN POHJA (IVU.pad -> selkeä A4-tuloste)
  Käyttö:
   1) Liitä IVU.padista poimittu data <script id="vuorodata"> -lohkoon
      (rivit alkavat D| B| tai kellonajalla). Ohje: ohje_claudelle.md
   2) Valinnainen: pysäköintipaikat <script id="paikat"> -lohkoon, esim. {"1036": "B3", "1028": "D1"}
   3) Avaa Chromessa -> Ctrl+P -> A4, skaalaus 100 %, Taustagrafiikka päälle.
   Teema: nappi "Teema: Väri / Mustavalko" sivun yläosassa, tai osoitteen perään ?teema=bw.
   Kalenteri: "Lataa kalenteriin (.ics)" tekee tiedoston Google- tai Apple-kalenteriin.
   Päivä/yö: nappi "🌙 Yötila / ☀️ Päivätila" (vain näytöllä, tuloste aina vaalea); oletus puhelimen oma asetus. ?tila=yo / ?tila=paiva.
   Kieli: liput FI / SV / EN / ET / RU valikossa (☰) (oletus suomi), tai osoitteen perään ?kieli=sv / en / et / ru.
  Jos datalohko on tyhjä, sivu näyttää liittämiskentän.
-->
<style>
@page { size: A4; margin: 15mm; }
* { box-sizing: border-box; }
body { margin:0; background:#fff; color:#000; font-family: Arial, Helvetica, sans-serif; }
section { page-break-after: always; break-after: page; }
section:last-child { page-break-after: auto; break-after: auto; }
@media screen { section { border-bottom: 2px dashed #999; padding: 20px 0 30px; } }
.jakso { font-family: Arial, Helvetica, sans-serif; color:#000; background:#fff; margin:0; font-size:15pt; }
.jakso .sivu { max-width:180mm; margin:0 auto; }
.jakso h1 { font-size:22pt; margin:0 0 2px; }
.jakso .nimi { font-size:12pt; color:#333; margin-bottom:10px; border-bottom:3px solid #000; padding-bottom:6px; }
.jakso table { width:100%; border-collapse:collapse; }
.jakso th { text-align:left; font-size:11pt; color:#333; border-bottom:2px solid #000; padding:4px 6px; }
.jakso td { padding:5px 5px; border-bottom:1px solid #bbb; font-size:14pt; vertical-align:middle; }
.jakso td.pvm { font-weight:bold; width:96px; white-space:nowrap; }
.jakso .vpv { display:inline-block; min-width:34px; margin-right:3px; }
.jakso td.vuoro { font-weight:bold; font-size:15pt; width:118px; }
.jakso td.aika { font-weight:bold; font-size:18pt; width:90px; }
.jakso .lap { display:inline-block; color:#fff; font-weight:bold; font-size:12pt; padding:3px 8px; border-radius:4px; }
.jakso .lap.as { background:#0b4f9c; }
.jakso .lap.varal { background:#000; font-size:13pt; white-space:nowrap; }
.jakso tr.vapaa td { background:#dff0df; color:#1e5b26; }
.jakso tr.vapaa td.selite { font-weight:bold; font-size:13pt; letter-spacing:1px; }
.jakso tr.vara td { background:#eee; }
.jakso tr.vara td.asema { font-size:12pt; font-style:italic; }
.jakso tr.viikko td { height:14px; border:none; border-bottom:3px solid #000; padding:0; }
.paiva { font-family: Arial, Helvetica, sans-serif; color:#000; background:#fff; margin:0; padding:0; font-size:14pt; }
.paiva .sivu { max-width:180mm; margin:0 auto; }
.paiva .ylä { display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #000; padding-bottom:6px; }
.paiva .pvm { font-size:22pt; font-weight:bold; }
.paiva .vuoro { font-size:20pt; font-weight:bold; }
.paiva .asema { background:#0b4f9c; color:#fff; font-size:20pt; font-weight:bold; padding:6px 16px; border-radius:6px; text-align:center; }
.paiva .asema small { display:block; font-size:10pt; font-weight:normal; }
.paiva .ajat { display:flex; gap:28px; font-size:20pt; margin:8px 0 10px; align-items:baseline; }
.paiva .ajat b { font-size:20pt; margin-left:6px; margin-right:24px; }
.paiva table { width:100%; border-collapse:collapse; }
.paiva tr { page-break-inside:avoid; }
.paiva td { padding:4px 5px; border-bottom:1px solid #bbb; vertical-align:top; font-size:13pt; }
.paiva td.aika { font-weight:bold; font-size:16pt; width:70px; white-space:nowrap; }
.paiva td.linja { width:100px; }
.paiva .lnro { display:inline-block; background:#000; color:#fff; font-weight:bold; font-size:16pt; padding:1px 8px; border-radius:4px; min-width:50px; text-align:center; }
.paiva .perillä { white-space:nowrap; font-size:12pt; color:#333; margin-left:10px; }
.paiva .väli { font-size:12pt; color:#000; display:block; margin-top:2px; }
.paiva .väli b { font-size:13pt; }
.paiva .lap { display:inline-block; color:#fff; font-weight:bold; font-size:12pt; padding:3px 7px; border-radius:4px; }
.paiva .lap.bus { background:#0b4f9c; }
.paiva .lap.car { background:#d97a00; }
.paiva .lap.tau { background:#1e7d32; }
.paiva .kulku { font-size:11pt; font-weight:bold; margin-left:8px; white-space:nowrap; }
.paiva tr.bussi td { background:#e3edf9; }
.paiva tr.bussi td:first-child { border-left:8px solid #0b4f9c; }

.paiva tr.auto-siirto td:first-child { border-left:8px solid #d97a00; }

.paiva tr.auto td { background:#fff3cc; border-top:3px solid #000; border-bottom:2px solid #000; font-size:20pt; padding:6px 8px; }
.paiva tr.auto span { margin-right:30px; white-space:nowrap; }
.paiva tr.auto b { font-size:20pt; }
.paiva .lap.mat { background:#6a3d9a; }
.paiva tr.matka td { background:#efe6f7; font-weight:bold; }
.paiva tr.matka td:first-child { border-left:8px solid #6a3d9a; }
.paiva tr.matka .kulku { color:#6a3d9a; }
.paiva.tiivis td { padding-top:2px; padding-bottom:2px; font-size:11.5pt; }
.paiva.tiivis td.aika { font-size:13.5pt; }
.paiva.tiivis .lnro { font-size:13.5pt; }
.paiva.tiivis .väli, .paiva.tiivis .perillä { font-size:10.5pt; }
.paiva.tiivis .väli b { font-size:11.5pt; }
.paiva.tiivis tr.väliin td { height:8px; }
.paiva.tiivis2 td { font-size:10.5pt; padding-top:1px; padding-bottom:1px; }
.paiva.tiivis2 td.aika, .paiva.tiivis2 .lnro { font-size:12pt; }
.paiva.tiivis2 .väli, .paiva.tiivis2 .perillä { font-size:9.5pt; }
.paiva.tiivis2 .väli b { font-size:10.5pt; }
.paiva tr.väliin td { height:12px; border:none; padding:0; }
.paiva tr.tauko td { background:#d9f2d9; font-weight:bold; padding-top:10px; padding-bottom:10px; border-top:2px solid #1e7d32; border-bottom:2px solid #1e7d32; }
.paiva tr.tauko td:first-child { border-left:8px solid #1e7d32; }
.paiva .ala { display:flex; flex-wrap:wrap; gap:6px 24px; margin-top:12px; font-size:12pt; border-top:2px solid #000; padding-top:6px; }
.paiva .ala div { margin-right:20px; display:inline-block; }

.jakso td.aika { font-size:15pt; width:64px; }
.jakso td.asema { width:92px; }
.jakso td.tauko { font-size:11.5pt; line-height:1.35; }
.jakso td.tauko b, .jakso td.tauko .tpaikka, .jakso .liitemerkki, .jakso .lepomerkki { white-space:nowrap; }
.jakso td.tauko b { font-size:12.5pt; }
.jakso .tpaikka { font-weight:bold; color:#1e5b26; font-size:10.5pt; }
.jakso .yht { margin-top:14px; border-top:3px solid #000; padding-top:6px; page-break-inside:avoid; }
.jakso .yht h2 { font-size:14pt; margin:0 0 6px; }
.jakso .yht h3 { font-size:11pt; margin:10px 0 4px; color:#333; text-transform:uppercase; letter-spacing:1px; }
.jakso .yht .isot div, .jakso .yht .ruudut div { display:inline-block; border:2px solid #000; border-radius:5px; padding:4px 10px; margin:0 8px 6px 0; vertical-align:top; }
.jakso .yht .ruudut div { border-width:1px; }
.jakso .yht span { display:block; font-size:9.5pt; color:#333; }
.jakso .yht .isot b { font-size:18pt; }
.jakso .yht .ruudut b { font-size:13pt; }
.paiva .taukopaikka { display:block; font-size:17pt; letter-spacing:0.5px; margin-top:2px; }
.paiva .paikka b { font-size:20pt; }
.paiva .paikka .tyhja { display:inline-block; width:70px; height:26px; border:2px solid #000; background:#fff; vertical-align:middle; margin-left:6px; border-radius:3px; }
.paiva.tiivis .taukopaikka { font-size:13pt; }

.jakso .sivu, .paiva .sivu { width:180mm; max-width:100%; }
.jakso.tiivis td { padding-top:2px; padding-bottom:2px; }
.jakso.tiivis .yht { margin-top:8px; }
.jakso.tiivis .yht h3 { margin:6px 0 3px; }

/* ===== Ohjauspalkki (ei tulostu) ===== */
#ohjaus { max-width:180mm; margin:10px auto 0; font-family:Arial,sans-serif; display:flex; flex-wrap:wrap; gap:6px; align-items:center;
  page-break-after:always; break-after:page; padding-bottom:10px; border-bottom:2px dashed #999; }
#ohjaus button { font-size:14px; padding:7px 12px; border:2px solid #0b4f9c; background:#fff; color:#0b4f9c; border-radius:5px; cursor:pointer; font-weight:bold; }
#ohjaus button.valittu { background:#0b4f9c; color:#fff; }

#ohjaus .vali { flex:1; }
@media print { #ohjaus, #syotto { display:none !important; } }

/* ===== BW-teema: mustavalkotulostin ===== */
body.bw .lap, body.bw .paiva .asema, body.bw .lnro { background:#000 !important; color:#fff !important; }
body.bw .lap.car, body.bw .lap.mat { background:#fff !important; color:#000 !important; border:2px solid #000; padding:1px 5px; }

body.bw .kulku, body.bw .tpaikka, body.bw tr.vapaa td { color:#000 !important; }

.jakso tr.vara td.asema { white-space:nowrap; font-size:10.5pt; }

/* ===== Herätykset ===== */
.paiva .herat { display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; margin:-2px 0 10px; font-size:11.5pt; }
.paiva .herat .otsake { font-weight:bold; font-size:10pt; letter-spacing:0.5px; margin-right:4px; }

body.bw .paiva .taukoher { color:#000; border-color:#000; }

.paiva .otsikko .pvm, .paiva .otsikko .vuoro { font-size:22pt; font-weight:bold; }

/* ===== Lepoaika ===== */

/* ===== Vuoroon liittyvät: VARA ja MATKUSTUS ===== */
